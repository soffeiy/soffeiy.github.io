<!DOCTYPE html>
<html>
<head>
    <title>Program Kalkulator</title>
    <style>
        /* Sedikit CSS agar tampilan lebih rapi */
        button { width: 100%; height: 40px; }
        input { width: 100%; box-sizing: border-box; text-align: right; }
    </style>
</head>
<body>
    <center>
        <h2>PROGRAM KALKULATOR</h2>
        <table border="1"> <!--ketebalan garis tepi hitam 1px -->
            <tr> 
            <!--colspan=banyak kolom perbaris -->
            <!--type = tipe elemen input, "text" berarti teks -->
               <!-- readonly = atribut boolean -->
                <td colspan="4"><input type="text" id="layar" readonly></td> 
                <!-- tr=tabel row, menentukan baris; td= coloumn data,  kolom di dalam baris
                 th= table header, buat judul kolom-->
            </tr>
            <tr> 
                <td><button onclick="tekanangka('1')">1</button></td>
                 <!-- "tekanangka('1')" memberi parameter pada fungsi tekan angka 
                  berdasarkan tombol <button> yang di tekan (>1<) -->
                <td><button onclick="tekanangka('2')">2</button></td>
                <td><button onclick="tekanangka('3')">3</button></td>
                <td><button onclick="tekanangka('+')">+</button></td>
                <!-- onclick adalah atribut html untuk eksekusi javascrpit ketika suatu tombol di klik -->
            </tr>
            <tr> 
                <td><button onclick="tekanangka('4')">4</button></td>
                <td><button onclick="tekanangka('5')">5</button></td>
                <td><button onclick="tekanangka('6')">6</button></td>
                <td><button onclick="tekanangka('-')">-</button></td>
            </tr>
            <tr> 
                <td><button onclick="tekanangka('7')">7</button></td>
                <td><button onclick="tekanangka('8')">8</button></td>
                <td><button onclick="tekanangka('9')">9</button></td>
                <td><button onclick="tekanangka('*')">*</button></td>
            </tr>
            <tr> 
                <td><button onclick="tekanangka('.')">.</button></td>
                <td><button onclick="tekanangka('0')">0</button></td>
                <td><button onclick="hitung()">=</button></td>
                <td><button onclick="tekanangka('/')">/</button></td>
            </tr>
            <tr>
                <td colspan="4"><button onclick="hapus()">C</button></td>
            </tr>
        </table>
    </center>

    <script>
        function tekanangka(angka) {
            // Memperbaiki typo 'doucument' menjadi 'document'
            document.getElementById("layar").value += angka;
            //document = untuk ubah tampilan layar
            //ambil elemen berdasarkan id = 
            //value = isi teks yang ada pada layar 

        }

        function hitung() {
            try {  //fungsi untuk dieksekusi 
                //fungsi eval() untuk evaluasi ekspresi matematika
                let hasil = eval(document.getElementById("layar").value);
                //yg diatas buat hitung operasi matematikanya, dn simpan nilainya di variabel "hasil"
                //statement dibawah untuk ganti tampilan layar yg di print brdasarkan apa
                //yang diklik user jadi "hasil", simpan hasil operasi itu
                document.getElementById("layar").value = hasil;
            } catch (e) { //berisi kode yang dijalankan jika terjadi suatu error
                document.getElementById("layar").value = "Error";
            }
        }

        function hapus() {
            document.getElementById("layar").value = "";
        }
    </script>
</body>
</html>
